name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: YAML is valid
        run: |
          pip install --quiet yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 140}}}" .gitlab-ci.yml .github/workflows/

      - name: Pipeline has the expected jobs and rules
        run: |
          python3 - <<'EOF'
          import yaml
          ci = yaml.safe_load(open(".gitlab-ci.yml"))
          jobs = {"validate", "deploy_dev", "deploy_stage", "deploy_live"}
          assert jobs <= ci.keys(), f"missing jobs: {jobs - ci.keys()}"
          for job, env, branch in [("deploy_dev", "dev", "develop"), ("deploy_stage", "stage", "stage"), ("deploy_live", "live", "main")]:
              assert ci[job]["extends"] == ".deploy"
              assert ci[job]["environment"]["name"] == env
              assert f'"{branch}"' in ci[job]["rules"][0]["if"]
          assert ci["deploy_live"]["rules"][0].get("when") == "manual", "Live must be a manual deploy"
          print("pipeline structure OK")
          EOF

      - name: ShellCheck
        run: shellcheck scripts/*.sh
